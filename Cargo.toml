[package]
name = "cr"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
jsonschema = { version = "0.49", default-features = false }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.11"
tempfile = "3.27"
time = { version = "0.3", features = ["formatting"] }
yaml_serde = "0.10"
