[package]
name = "cr"
version = "0.2.35"
# Edition 2024 needs Rust 1.85, and the let-chains it enables (`src/audit.rs`,
# `src/server.rs`, `tests/server_api.rs`) need 1.88. Both sit under the floor
# below, so neither is what sets it.
edition = "2024"
# `src/audit.rs` and `src/sync.rs` use `File::lock`/`File::try_lock` (the std
# `file_lock` feature), stabilised in Rust 1.89. Nothing in `Cargo.lock` needs a
# newer compiler, so 1.89 is the true floor. The `msrv` job in
# `.github/workflows/ci.yml` builds and tests on exactly this version so the
# number cannot drift without CI noticing.
rust-version = "1.89"
description = "A local-first database made from Markdown files with typed YAML front matter, a tamper-evident audit log, a CLI, a REST API, and server-rendered views"
repository = "https://github.com/AnandChowdhary/cr"
license = "MIT"
readme = "README.md"
keywords = ["markdown", "database", "local-first", "audit-log", "cli"]
categories = [
  "command-line-utilities",
  "database",
  "filesystem",
  "web-programming::http-server",
]

# Keep the published tarball to source and prose. The screenshots are ~300 KiB of
# already-compressed JPEG (roughly 80% of the crate) and crates.io rewrites the
# README's relative image links to `repository`, so they still render there.
# CI configuration, and `scripts/tailwind.sh`, which regenerates a stylesheet
# that is already committed, are meaningless to a downstream consumer.
#
# `src/static/` is the deliberate exception to that instinct: the vendored htmx
# release is ~50 KiB of minified JavaScript and the compiled Tailwind sheet
# another ~30 KiB, which looks like exactly the kind of weight the line above
# trims, but `src/server.rs` pulls both in with `include_str!`, so excluding
# them would publish a crate that does not compile.
# Shipping it is also the point — it is what lets `cargo install cr` produce a
# binary whose UI needs no network.
exclude = ["/docs/screenshots/", "/.github/", "/scripts/"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
hmac = "0.13.0"
# Default features stay off: they are `resolve-http`/`resolve-file`/`tls-*`,
# which fetch a `$ref` over the network, and a local-first database has no
# business doing that. `idna` is a different thing and has to be asked for
# explicitly. Up to 0.49 the `idn-hostname` and `idn-email` formats were
# compiled in unconditionally; 0.52 put them behind this feature, and a format
# the build does not know is *accepted*, not rejected. So without `idna` a user
# schema declaring draft-07 - where `format` asserts by default, unlike the
# 2020-12 schemas in `examples/` - would go on validating and stop refusing
# anything. `tests/database_cli.rs` guards that.
jsonschema = { version = "0.57.0", default-features = false, features = ["idna"] }
libc = "0.2.189"
maud = { version = "0.27.0", features = ["axum"] }
percent-encoding = "2.3.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_html_form = "0.4.1"
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
yaml_serde = "0.10.7"
zeroize = "1.9.0"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# `cargo install cr` builds with this profile, so it is the one users actually
# get. Measured on this tree: 12.7 MB -> 8.3 MB (-35%), with no build-time
# regression (95s -> 90s, one sample each). Nothing in CI builds release, so
# this costs the pipeline nothing.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Lint policy lives here rather than only in CI flags, so `cargo clippy` on a
# laptop gates on exactly what the pipeline gates on. Every lint below is
# already satisfied by the tree as it stands: this encodes the status quo so it
# cannot regress, it is not a cleanup backlog.
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
# `forbid(unsafe_code)` would be a lie: `src/sync.rs` needs `libc::kill` to stop
# a sync adapter's whole process group. The useful policy is not "no unsafe" but
# "every unsafe block is justified in writing and does exactly one thing".
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

# The HTTP server is async and the audit/sync paths hold file locks. Holding a
# lock across an await is the failure mode that class of code actually has.
await_holding_lock = "warn"

# `mem::forget` on a lock guard would silently defeat the sync mutual exclusion.
mem_forget = "warn"

# Debugging scaffolding must not reach main.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Guards the `[package]` metadata above against quietly rotting. Deliberately
# not the whole `clippy::cargo` group: `multiple_crate_versions` fires on
# transitive duplicates (`syn`, `getrandom`, `r-efi`) we do not control.
cargo_common_metadata = "warn"
